# tpmd runs as the standard TPM access user, which the tpm2-tss packages create
# on a machine that has the TPM userspace installed. This package creates it
# where they have not, so that tpmd.service can start on any Debian-like system
# instead of naming a user that might be missing — systemd refuses to start a
# unit whose User= does not resolve. An existing definition always wins:
# systemd-sysusers creates what is absent and never rewrites what is present.
#
# Installed by debian/rules rather than by dh_installsysusers: the helper exists
# but is not part of the compat-13 default sequence, so a file named for it would
# be shipped into nothing at all — and silently, since nothing errors. The
# explicit line also keeps the destination next to the source. See
# debian/tpmd.postinst for how the file is applied at install time.
u tss - "TPM resource manager access" /var/lib/tpm /usr/sbin/nologin
