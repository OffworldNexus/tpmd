[workspace]
resolver = "2"
# A local copy of one published crate, used through `[patch.crates-io]` below to
# move the SQLite it links past RUSTSEC-2026-0459. Kept out of the workspace so
# its (unmodified) tests and lints are not ours to run.
exclude = ["third-party/sqlx-sqlite"]
members = [
    "crates/tpmd-proto",
    "crates/tpmd-backend",
    "crates/tpmd-store",
    "crates/tpmd-backend-dummy",
    "crates/tpmd-backend-keyring",
    "crates/tpmd-backend-linux-tpm",
    "crates/tpmd-backend-windows-cng",
    "crates/tpmd-backend-macos-se",
    "crates/tpmd-plugin",
    "crates/tpmd-backend-keyring-plugin",
    "crates/tpmd-backend-linux-tpm-plugin",
    "crates/tpmd-plugin-fixture",
    "crates/tpmd-ipc",
    "crates/tpmd",
    "crates/tpmd-client",
    "crates/tpmd-demo",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
authors = ["Offworld Nexus Authors"]
license = "Apache-2.0"
repository = "https://github.com/OffworldNexus/tpmd"

[workspace.dependencies]
# Internal crates. `version` accompanies each `path` so the crates could be
# published later without editing every manifest.
tpmd-proto = { path = "crates/tpmd-proto", version = "0.1.2" }
tpmd-backend = { path = "crates/tpmd-backend", version = "0.1.2" }
tpmd-store = { path = "crates/tpmd-store", version = "0.1.2" }
tpmd-backend-dummy = { path = "crates/tpmd-backend-dummy", version = "0.1.2" }
tpmd-backend-keyring = { path = "crates/tpmd-backend-keyring", version = "0.1.2" }
tpmd-backend-linux-tpm = { path = "crates/tpmd-backend-linux-tpm", version = "0.1.2" }
tpmd-backend-windows-cng = { path = "crates/tpmd-backend-windows-cng", version = "0.1.2" }
tpmd-backend-macos-se = { path = "crates/tpmd-backend-macos-se", version = "0.1.2" }
tpmd-plugin = { path = "crates/tpmd-plugin", version = "0.1.2" }
tpmd-ipc = { path = "crates/tpmd-ipc", version = "0.1.2" }
tpmd-client = { path = "crates/tpmd-client", version = "0.1.2" }

# macOS Secure Enclave access, through safe wrappers — so this backend needs no
# `unsafe` either, which is why it is not a third exception to the rule in
# AGENTS.md. `OSX_10_15` is not in `security-framework`'s default feature set and
# is what makes `Location::DataProtectionKeychain` — the keychain Secure Enclave
# keys must live in — expressible without reaching for raw constants by hand.
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = "2.17"
core-foundation = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
# serde has no Serialize/Deserialize impl for arrays longer than 32 bytes;
# the key id (33) and signature (64) need this shim, exactly as weaver-mux does.
serde-big-array = "0.5"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
thiserror = "2.0"
# Same RustCrypto line as weaver-mux, so signatures produced here verify with
# weaver_mux::auth::verify byte-for-byte.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
# Explicit SHA-256 for the hardware path: the TPM signs a pre-computed digest,
# so we must hash the message ourselves (same 0.10 line `p256` already uses).
sha2 = "0.10"
getrandom = "0.3"
tokio = { version = "1.43", features = [
    "sync",
    "rt",
    "fs",
    "macros",
    "net",
    "time",
    "signal",
    "rt-multi-thread",
    "io-util",
] }
# One SQLite file, shared by every backend, owned by SeaORM. `runtime-tokio`
# (rather than a `*-tls` runtime) keeps the TLS stack — and its `ring`/`ISC`
# license — out of the dependency tree; SQLite never speaks the network.
sea-orm = { version = "2.0", default-features = false, features = [
    "macros",
    "sqlx-sqlite",
    "runtime-tokio",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
] }
# Object-safe async trait objects: the daemon stores `Arc<dyn Backend>`.
async-trait = "0.1"
# Scrubs the unsealed P-256 scalar from memory on the TPM backend's sealed path.
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
# OS credential stores. The `keyring` crate itself is deliberately *not* used:
# at its current major it hard-wires one store per platform and tells
# applications that choose stores per platform to link `keyring-core` plus the
# store crates instead — and its Linux arm is the kernel keyring, which dies at
# logout. `tpmd-backend-keyring` pulls exactly one of the three store crates in,
# chosen by target OS, so no build contains another platform's store.
keyring-core = "1.0"
zbus-secret-service-keyring-store = "1.0"
apple-native-keyring-store = "1.0"
windows-native-keyring-store = "1.1"
# The session bus itself, for noticing that a locked store has reopened. The store
# crate talks to the Secret Service but does not expose its connection, and an
# unlock is worth an event rather than a timer — async only, matching what the
# store already pulls in.
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"
proptest = { version = "1.11", default-features = false, features = ["std"] }
# `dlopen` for the run-time plugin loader (the packaging split). Only ever
# compiled where the split is built; a normal build contains neither the loader
# nor this dependency.
libloading = "0.8"
# Unix peer-credential retrieval (SO_PEERCRED / LOCAL_PEERCRED) and file modes.
libc = "0.2"
# Reading the listening socket a service manager hands over with `Sockets=`
# (systemd socket activation), so the packaged agent never binds its own path.
# Safe API: the `from_raw_fd` this needs lives in the crate, not in ours.
listenfd = "1.0"
# Windows platform APIs. `Win32_Security_Cryptography` is CNG (NCrypt*), used by
# `tpmd-backend-windows-cng` for the Platform Crypto Provider.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# `sqlx-sqlite` 0.9.0 is the newest published release, but it pins the SQLite
# bindings below 0.38, whose bundled SQLite is the one RUSTSEC-2026-0459 covers.
# The local copy is that release with one line changed: the `libsqlite3-sys`
# requirement now admits 0.39, which bundles the patched SQLite 3.54.1. Drop
# this patch once sqlx releases a `sqlx-sqlite` that makes the same move.
[patch.crates-io]
sqlx-sqlite = { path = "third-party/sqlx-sqlite" }
