[package]
name = "tpmd-ipc"
description = "Cross-platform local endpoints, native caller authentication, secure filesystem helpers and framed I/O for tpmd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tpmd-proto.workspace = true
thiserror.workspace = true
tokio.workspace = true
postcard.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# systemd socket activation: the packaged service is handed its listener rather
# than binding one, so this is Linux-only, where that service manager exists.
[target.'cfg(target_os = "linux")'.dependencies]
listenfd.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
