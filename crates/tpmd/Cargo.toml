[package]
name = "tpmd"
description = "The tpmd local key agent daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tpmd"
path = "src/main.rs"

[dependencies]
tpmd-proto.workspace = true
tpmd-backend.workspace = true
# The daemon reads the selection record straight from the shared store, before it
# has chosen a backend — so it depends on the store itself, not only on backends.
tpmd-store.workspace = true
sea-orm.workspace = true
tpmd-backend-dummy.workspace = true
# The keyring backend serves all three platforms, so it is built everywhere.
tpmd-backend-keyring.workspace = true
tpmd-ipc.workspace = true
# The daemon ships its own diagnostic client so that "is it running, and what
# can it do?" has a first-class answer (and so the published client library is
# exercised by the same binary it serves). It does not create a dependency
# cycle: the client does not know about the daemon.
tpmd-client.workspace = true
async-trait.workspace = true
clap.workspace = true
# The backend selection record is `postcard`-encoded — the same vocabulary the
# wire uses, and the only sane way to store reasons that contain punctuation.
serde.workspace = true
postcard.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

# The Linux TPM backend is compiled in only on Linux, so a Windows or macOS
# build never links its code.
[target.'cfg(target_os = "linux")'.dependencies]
tpmd-backend-linux-tpm.workspace = true

# Likewise the Windows CNG backend exists only on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
tpmd-backend-windows-cng.workspace = true

# And the Secure Enclave backend only on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
tpmd-backend-macos-se.workspace = true

[dev-dependencies]
tempfile.workspace = true
tpmd-ipc.workspace = true
tpmd-proto.workspace = true
p256.workspace = true
