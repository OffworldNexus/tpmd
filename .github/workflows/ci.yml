name: CI

on:
  # Every ticket gets its own `feature/<linear-id>-…` branch, so those are
  # first-class CI targets alongside the integration branch, `develop`.
  push:
    branches: [develop, "feature/**"]
  pull_request:

# One concurrent run per branch; never cancel a run already in progress on
# `develop`.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Every backend is built and tested on all three OSes — the dummy and the
      # keyring backend exist everywhere, the TPM/CNG ones only where their
      # platform is.
      - name: Build
        run: cargo build --workspace --all-targets

      # The keyring backend's store-gated tests need a real OS credential store
      # that can be *written* to. This installs one, and the script below runs it
      # with `TPMD_TEST_KEYRING=require`, so a store that cannot be reached fails
      # the job instead of silently skipping the very tests that need it.
      - name: Install a keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11

      - name: Test (Linux, with a keyring)
        if: runner.os == 'Linux'
        run: .github/scripts/test-with-keyring.sh

      # macOS and Windows runners are logged-in user sessions that already have
      # a login keychain / Credential Manager, so they need no setup.
      - name: Test
        if: runner.os != 'Linux'
        env:
          TPMD_TEST_KEYRING: require
        run: cargo test --workspace --all-targets

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The packaging split is the same crate in a different shape — no backend
      # compiled in, a loader instead — so it is linted as its own thing rather
      # than assumed to follow from the build above.
      - name: Clippy (the packaging split)
        run: >-
          cargo clippy -p tpmd --no-default-features --features loadable-backends
          --all-targets -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
