name: security advisories

# Hourly RustSec check and end-to-end autonomous security triage / release.
#
# The check runs `cargo deny` against a *strict* copy of deny.toml (every line
# marked TEMPORARY removed, so time-boxed deferrals stay visible) AND verifies
# that the latest `v*` release tag actually has a published GitHub release.
#
# When work is found, headless OpenCode (OpenRouter) owns the process all the
# way through (.github/scripts/security-agent-prompt.md):
#   1. Assesses with concrete code evidence whether tpmd is actually exposed.
#   2. Never vendors, forks, or `[patch]`es third-party crates.
#   3. Only cuts a patch release when tpmd is genuinely exposed (updating
#      develop without releasing when unexposed, or documenting non-exposure in
#      deny.toml when upstream has no compatible published fix yet).
#   4. Drives the PR, CI checks, merge, annotated tag, and `packaging-deb.yml`
#      release workflow to completion — diagnosing and fixing CI or packaging
#      failures along the way rather than stopping halfway.
#
# After the agent exits, a deterministic audit step verifies that `origin/develop`
# passes strict `cargo deny`, no workflows or vendored forks were introduced, no
# bot PRs were left dangling, and the latest `v*` tag has a published release.
#
# GitHub's `schedule` is best-effort; `packaging/security-cron.sh` is the
# external hourly trigger to run from cron or a systemd timer.
#
# `RELEASE_TOKEN` is a user/fine-grained token rather than `GITHUB_TOKEN`: the
# organization forbids GitHub Actions from creating pull requests, and pushes
# made with `GITHUB_TOKEN` do not trigger downstream CI or packaging workflows.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: security-advisories
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  OPENCODE_MODEL: openrouter/deepseek/deepseek-v4.1-flash-1017

jobs:
  advisories:
    name: check and patch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Record starting commit
        id: meta
        run: |
          set -euo pipefail
          echo "start_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Patch only after the first stable release
        id: gate
        run: |
          set -euo pipefail
          if ! git tag --list 'v[0-9]*' | grep -q .; then
            echo "no stable release tag yet: nothing to patch"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        if: steps.gate.outputs.run == 'true'
        with:
          tool: cargo-deny

      - name: Look for pending security work
        id: work
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          source = pathlib.Path("deny.toml")
          lines = [
              line
              for line in source.read_text().splitlines(keepends=True)
              if "TEMPORARY" not in line
          ]
          pathlib.Path("/tmp/deny-strict.toml").write_text("".join(lines))
          PY

          status=0
          cargo deny --config /tmp/deny-strict.toml --format json check advisories \
            > /tmp/deny.out 2> /tmp/deny.json || status=$?

          count=$(python3 - <<'PY'
          import json
          n = 0
          for line in open("/tmp/deny.json"):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              fields = event.get("fields", {})
              if event.get("type") == "diagnostic" and fields.get("code") == "vulnerability":
                  advisory = fields.get("advisory", {})
                  print(f"- {advisory.get('id')}: {advisory.get('title')}")
                  n += 1
          print(n)
          PY
          )
          pending=$(printf '%s\n' "$count" | tail -1)
          pending=${pending:-0}
          printf '%s\n' "$count" | sed '$d' | tee /tmp/vulnerabilities.txt
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

          # A non-vulnerability cargo-deny failure (unmaintained notice, license,
          # source) is reported directly rather than handed to the security agent.
          if [ "$status" -ne 0 ] && [ "$pending" -eq 0 ]; then
            echo "cargo deny failed for a non-vulnerability reason" >&2
            cat /tmp/deny.out >&2
            exit "$status"
          fi

          # Also check whether the highest release tag was left without a
          # published GitHub release (e.g. a packaging failure or timeout on an
          # earlier run), so a stranded release is recovered rather than ignored.
          rm -f /tmp/unreleased-tag.txt
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          unreleased_tag=""
          if [ -n "$latest_tag" ]; then
            released_assets=$(gh release view "$latest_tag" --json isDraft,assets \
              --jq 'select(.isDraft == false) | .assets | length' 2>/dev/null || echo 0)
            if [ "${released_assets:-0}" -eq 0 ]; then
              unreleased_tag="$latest_tag"
              tag_sha=$(git rev-parse "$latest_tag^{commit}")
              {
                echo "Tag $latest_tag (commit $tag_sha) has no published GitHub release."
                echo
                echo "Recent packaging-deb.yml runs:"
                gh run list --workflow packaging-deb.yml --limit 10 \
                  --json databaseId,status,conclusion,headSha,displayTitle,createdAt
              } | tee /tmp/unreleased-tag.txt
            fi
          fi
          echo "unreleased_tag=$unreleased_tag" >> "$GITHUB_OUTPUT"

          if [ "$pending" -ne 0 ] || [ -n "$unreleased_tag" ]; then
            echo "needs_agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_agent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenCode
        if: steps.gate.outputs.run == 'true' && steps.work.outputs.needs_agent == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          git config user.name "tpmd security bot"
          git config user.email "security-bot@offworld.nexus"

      - name: Run autonomous security agent
        if: steps.gate.outputs.run == 'true' && steps.work.outputs.needs_agent == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"
          rm -f /tmp/security-blocked

          cp .github/scripts/security-agent-prompt.md /tmp/prompt.md
          {
            echo
            echo "---"
            echo
            echo "## Current Run Trigger"
            echo
            echo "- Pending vulnerability diagnostics: ${{ steps.work.outputs.pending }}"
            if [ -s /tmp/vulnerabilities.txt ]; then
              cat /tmp/vulnerabilities.txt
            fi
            if [ -f /tmp/unreleased-tag.txt ]; then
              echo
              echo "### Stranded Release Tag Requiring Recovery"
              echo
              cat /tmp/unreleased-tag.txt
            fi
          } >> /tmp/prompt.md

          timeout 95m opencode --standalone run --auto \
            --model "$OPENCODE_MODEL" --format json \
            "$(cat /tmp/prompt.md)" | tee /tmp/opencode.json

      - name: Audit final repository and release state
        if: steps.gate.outputs.run == 'true' && steps.work.outputs.needs_agent == 'true'
        run: |
          set -euo pipefail
          if [ -f /tmp/security-blocked ]; then
            echo "Security agent reported a blocker requiring human intervention:" >&2
            cat /tmp/security-blocked >&2
            exit 1
          fi

          git fetch --prune --prune-tags --force origin

          if ! git diff --quiet "${{ steps.meta.outputs.start_sha }}" origin/develop -- .github/workflows/; then
            echo "audit failed: .github/workflows/ was modified on develop" >&2
            git diff "${{ steps.meta.outputs.start_sha }}" origin/develop -- .github/workflows/ >&2
            exit 1
          fi

          vendored=$(git ls-tree -d --name-only origin/develop third-party vendor || true)
          if [ -n "$vendored" ]; then
            echo "audit failed: vendored crate directory present on develop: $vendored" >&2
            exit 1
          fi

          if git show origin/develop:Cargo.toml | grep -qE '^\[(patch|replace)(\.|\])'; then
            echo "audit failed: [patch] or [replace] section added to Cargo.toml" >&2
            exit 1
          fi

          if git show origin/develop:Cargo.toml | grep -qE '^[a-zA-Z0-9_-]+[[:space:]]*=.*git[[:space:]]*='; then
            echo "audit failed: git dependency added to Cargo.toml" >&2
            exit 1
          fi

          open_bot_prs=$(gh pr list --state open --json number,headRefName,title \
            --jq '[.[] | select(.headRefName | startswith("security/"))]')
          if [ "$open_bot_prs" != "[]" ]; then
            echo "audit failed: open security/* PR(s) left unmerged: $open_bot_prs" >&2
            exit 1
          fi

          git checkout --detach origin/develop
          python3 - <<'PY'
          import pathlib
          source = pathlib.Path("deny.toml")
          lines = [
              line
              for line in source.read_text().splitlines(keepends=True)
              if "TEMPORARY" not in line
          ]
          pathlib.Path("/tmp/deny-strict-final.toml").write_text("".join(lines))
          PY
          cargo deny --config /tmp/deny-strict-final.toml check
          cargo fmt --all --check

          latest_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          [ -n "$latest_tag" ] || { echo "audit failed: no release tag found" >&2; exit 1; }
          if [ "$(git cat-file -t "refs/tags/$latest_tag")" != "tag" ]; then
            echo "audit failed: $latest_tag is not an annotated tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$latest_tag^{commit}" origin/develop; then
            echo "audit failed: $latest_tag is not an ancestor of origin/develop" >&2
            exit 1
          fi
          tag_cargo_ver=$(git show "$latest_tag:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          if [ "$tag_cargo_ver" != "${latest_tag#v}" ]; then
            echo "audit failed: $latest_tag has Cargo.toml version $tag_cargo_ver" >&2
            exit 1
          fi
          released_assets=$(gh release view "$latest_tag" --json isDraft,assets \
            --jq 'select(.isDraft == false) | .assets | length' 2>/dev/null || echo 0)
          if [ "${released_assets:-0}" -eq 0 ]; then
            echo "audit failed: $latest_tag has no published GitHub release with assets" >&2
            exit 1
          fi
          echo "audit passed: origin/develop is clean and $latest_tag is published ($released_assets assets)"
