name: security advisories

# Hourly RustSec check with an automated fix and patch release.
#
# The check is `cargo deny` against a *strict* copy of deny.toml: every line
# marked TEMPORARY is removed first, so a time-boxed acceptance cannot hide a
# fixable advisory from this workflow. When a vulnerability is found, headless
# OpenCode (OpenRouter) updates the affected crates and removes the temporary
# ignores; the workflow then runs the tests, lands the change through a PR,
# bumps the patch version, tags it, and dispatches the normal packaging
# workflow on the tag.
#
# A user token is used instead of GITHUB_TOKEN because the organization forbids
# GitHub Actions from creating pull requests, and because a GITHUB_TOKEN push or
# tag does not fire the next workflow. `RELEASE_TOKEN` is therefore an account
# token with `repo` and `workflow`; a dedicated fine-grained token with
# contents/pull-requests/actions/workflows write is the intended replacement.
# The workflow still verifies every step explicitly: it waits for the PR checks
# before merging, and waits for the packaging run before claiming the release.

on:
  schedule:
    # Hourly, off the hour: the nightly packaging run and everyone else's cron
    # traffic do not need us at minute zero.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: security-advisories
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # `opencode run --model` wants `provider/model`; OpenRouter's own ID follows.
  OPENCODE_MODEL: openrouter/deepseek/deepseek-v4.1-flash-1017

jobs:
  advisories:
    name: check and patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A user token, not the workflow token: the organization forbids GitHub
      # Actions from creating pull requests, and a GITHUB_TOKEN push or tag does
      # not fire the next workflow. `RELEASE_TOKEN` is an account token with
      # `repo` and `workflow`; replace it with a dedicated fine-grained token
      # (contents, pull requests, actions, workflows: write) when one exists.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The default branch is where a patch is released from, and the tag
          # list is needed to compute the next patch version. The token makes
          # the branch/tag pushes below real pushes, so CI and the packaging
          # workflow react to them.
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Patch only after the first stable release
        id: gate
        run: |
          set -euo pipefail
          if ! git tag --list 'v[0-9]*' | grep -q .; then
            echo "no stable release tag yet: nothing to patch"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          components: rustfmt

      - uses: taiki-e/install-action@v2
        if: steps.gate.outputs.run == 'true'
        with:
          tool: cargo-deny

      - name: Build a strict advisory config
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          source = pathlib.Path("deny.toml")
          lines = [
              line
              for line in source.read_text().splitlines(keepends=True)
              if "TEMPORARY" not in line
          ]
          pathlib.Path("/tmp/deny-strict.toml").write_text("".join(lines))
          print("removed every TEMPORARY line from deny.toml")
          PY

      - name: Look for fixable vulnerabilities
        id: deny
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          status=0
          cargo deny --config /tmp/deny-strict.toml --format json check advisories \
            > /tmp/deny.out 2> /tmp/deny.json || status=$?

          count=$(python3 - <<'PY'
          import json
          n = 0
          for line in open("/tmp/deny.json"):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              fields = event.get("fields", {})
              if event.get("type") == "diagnostic" and fields.get("code") == "vulnerability":
                  advisory = fields.get("advisory", {})
                  print(f"- {advisory.get('id')}: {advisory.get('title')}")
                  n += 1
          print(n)
          PY
          )
          pending=$(printf '%s\n' "$count" | tail -1)
          printf '%s\n' "$count" | sed '$d' | tee /tmp/vulnerabilities.txt
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

          # A failure that is not a vulnerability (an unmaintained crate, a
          # licence, a source) is not this workflow's job: report it and stay
          # red rather than handing it to the model.
          if [ "$status" -ne 0 ] && [ "$pending" -eq 0 ]; then
            echo "cargo deny failed for a non-vulnerability reason" >&2
            cat /tmp/deny.out >&2
            exit "$status"
          fi

      - name: Install OpenCode
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Fix with headless OpenCode
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"
          cat > /tmp/prompt.md <<'PROMPT'
          You are the dependency-security bot for the tpmd repository. `cargo deny`
          found fixable RustSec vulnerabilities. Fix them in the working tree.

          Context:
          - /tmp/deny.json: one JSON object per line; the diagnostics with
            "code":"vulnerability" are the ones to fix.
          - /tmp/deny-strict.toml: the config that was checked. It is deny.toml
            with every line containing TEMPORARY removed, which is why the
            advisories appear here even though the normal config accepts them.

          Rules:
          1. Read /tmp/deny.json and identify every vulnerability diagnostic.
          2. Update only the affected crates, using
             `cargo update -p <crate> --precise <version>` to the smallest
             published version that fixes the advisory. Do not run a blanket
             `cargo update` and do not touch unrelated crates. The RustSec
             advisories carry the patched range and a link; use it.
          3. Remove only the ignore lines in deny.toml whose comment contains
             TEMPORARY, together with the comment block that explains them.
             Leave the zbus unmaintained ignores and every other line alone.
          4. Run `cargo deny --config /tmp/deny-strict.toml check advisories`
             until it passes, then `cargo test --workspace --all-targets -q`.
          5. Do not change the workspace version, do not write release notes, and
             do not commit, push, tag or open a pull request. Do not edit Rust
             source. The workflow owns the release.

          If an advisory has no fixed version, or a fix needs a semver-incompatible
          upgrade, stop and write /tmp/security-blocked with the RUSTSEC id and
          what blocked it. Otherwise print a short list of the crates you moved,
          with their old and new versions.
          PROMPT
          timeout 45m opencode --standalone run --auto \
            --model "$OPENCODE_MODEL" --format json \
            "$(cat /tmp/prompt.md)" | tee /tmp/opencode.json

      - name: Validate the fix
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        run: |
          set -euo pipefail
          if [ -f /tmp/security-blocked ]; then
            echo "OpenCode reported that it cannot fix this:" >&2
            cat /tmp/security-blocked >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "OpenCode changed nothing" >&2
            exit 1
          fi
          unexpected=$(git status --porcelain | awk '{print $2}' \
            | grep -v -E '^(Cargo\.toml|Cargo\.lock|deny\.toml)$' || true)
          if [ -n "$unexpected" ]; then
            echo "OpenCode changed files this workflow does not release:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if grep -q 'TEMPORARY' deny.toml; then
            echo "a temporary advisory ignore survived the fix" >&2
            exit 1
          fi
          cargo deny --config /tmp/deny-strict.toml check advisories
          cargo fmt --all --check
          cargo test --workspace --all-targets -q
          git diff --stat

      - name: Bump the patch version
        id: version
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          [ -n "$latest" ] || { echo "no release tag to patch" >&2; exit 1; }
          base=${latest#v}
          major=${base%%.*}
          rest=${base#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          expected="${major}.${minor}.$((patch + 1))"
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)

          python3 - "$current" "$expected" <<'PY'
          import pathlib
          import sys

          current, expected = sys.argv[1], sys.argv[2]
          manifest = pathlib.Path("Cargo.toml")
          text = manifest.read_text()
          updated = text.replace(f'version = "{current}"', f'version = "{expected}"')
          if updated == text:
              raise SystemExit(f"could not bump {current} in Cargo.toml")
          manifest.write_text(updated)
          PY

          cargo update --workspace
          cargo check --workspace --all-targets -q
          echo "version=$expected" >> "$GITHUB_OUTPUT"
          echo "patching $latest to v$expected"

      - name: Write the release notes
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        run: |
          set -euo pipefail
          .github/scripts/security-release-notes.py \
            --deny-json /tmp/deny.json \
            --lock Cargo.lock \
            --version "${{ steps.version.outputs.version }}" \
            --output /tmp/release-notes.md

      - name: Commit, push and open the PR
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        run: |
          set -euo pipefail
          branch="security/rustsec-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch=$branch" >> "$GITHUB_ENV"
          git config user.name "tpmd security bot"
          git config user.email "security-bot@offworld.nexus"
          git switch -c "$branch"
          git add Cargo.toml Cargo.lock deny.toml
          git commit \
            -m "[security] Fix RustSec advisories for ${{ steps.version.outputs.version }}" \
            -m "$(cat /tmp/release-notes.md)"
          git push origin "$branch"
          pr_url=$(gh pr create \
            --base develop \
            --head "$branch" \
            --title "[security] Fix RustSec advisories for ${{ steps.version.outputs.version }}" \
            --body "$(cat /tmp/release-notes.md)")
          echo "pr=$pr_url" >> "$GITHUB_ENV"
          echo "opened $pr_url"

      - name: Wait for the PR checks
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        run: |
          set -euo pipefail
          # The PR was opened with a real user token, so `pull_request` fired
          # CI. Wait until the check runs exist (the event takes a moment), then
          # watch them; a required context that fails fails this step.
          for _ in $(seq 1 60); do
            count=$(gh pr checks "$pr" --json name --jq 'length' 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && break
            sleep 5
          done
          timeout 90m gh pr checks "$pr" --watch --interval 20

      - name: Merge the PR
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        run: |
          set -euo pipefail
          # One retry: the base can move while the checks run, and branch
          # protection requires the branch to be up to date.
          if ! gh pr merge "$pr" --squash; then
            echo "merge refused; rebasing on develop and waiting for CI once" >&2
            git fetch origin develop
            git rebase origin/develop
            git push --force-with-lease origin "$branch"
            for _ in $(seq 1 60); do
              count=$(gh pr checks "$pr" --json name --jq 'length' 2>/dev/null || echo 0)
              [ "$count" -gt 0 ] && break
              sleep 5
            done
            timeout 90m gh pr checks "$pr" --watch --interval 20
            gh pr merge "$pr" --squash
          fi

      - name: Tag and dispatch the release
        if: steps.gate.outputs.run == 'true' && steps.deny.outputs.pending != '0'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git fetch origin develop
          git checkout -B develop origin/develop
          git reset --hard origin/develop
          git push origin --delete "$branch" || true

          # The tag is annotated: the release workflow reads its first line as
          # the release title and prepends the rest to the generated notes.
          git tag -a "v$version" -F /tmp/release-notes.md
          # A real user token makes this a real tag push, so `push` triggers the
          # packaging workflow (a GITHUB_TOKEN push would not).
          git push origin "v$version"

          tag_sha=$(git rev-parse "v$version^{commit}")
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh run list --workflow packaging-deb.yml \
              --event push --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$tag_sha\") | .databaseId" | head -1)
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo "release run never appeared" >&2; exit 1; }
          gh run watch "$run_id" --exit-status
          echo "released v$version"
