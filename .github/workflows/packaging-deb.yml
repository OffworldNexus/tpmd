name: deb packages

# Nightly .deb builds for every currently supported Debian-like release, pushed
# to the signed APT repository on Cloudsmith (see docs/install.md). Nothing here
# runs on the push or pull-request path: the test suite and static analysis live
# in ci.yml, and this workflow exists to publish, not to gate.
on:
  schedule:
    # Nightly, off the hour so it does not collide with the release traffic of
    # everyone else's nightly builds.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to stamp, if the default is not wanted. A tagged release
          reuses this workflow unchanged with the tag's version.
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CLOUDSMITH_OWNER: offworld-nexus
  # A repository variable, not a literal: the slug is also the URL users paste
  # into sources.list.d, so changing it must be a settings change rather than a
  # commit. The default is the intended slug; override it while a different one
  # is in use.
  CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO || 'apt' }}
  # The suite the .deb is published under. One artifact serves every release,
  # which is the whole reason it can be published as any-distro/any-version.
  CLOUDSMITH_DISTRO: any-distro
  CLOUDSMITH_VERSION: any-version

jobs:
  version:
    name: decide the version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.pick.outputs.version }}
      component: ${{ steps.pick.outputs.component }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        name: Pick a version and a channel
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            # A manual run is a nightly unless someone says otherwise, which is
            # what the version input is for.
            version='${{ inputs.version }}'
            component=nightly
          elif [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            # A tagged release is its own version and belongs on the stable
            # channel: 0.1.0 sorts above every 0.1.0~nightly… that came before.
            version="${GITHUB_REF_NAME#v}"
            component=main
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            version="${base}~nightly$(date -u +%Y%m%d).r${GITHUB_RUN_NUMBER}+g$(git rev-parse --short HEAD)"
            component=nightly
          fi
          echo "packaging $version to the $component channel"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "component=$component" >> "$GITHUB_OUTPUT"

  # One source package per run, built once and shared: it is published beside the
  # binaries, and every architecture builds its binaries *from* it, so what
  # `apt-get source tpmd` hands a user is what the published binaries came from.
  source:
    name: source package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the build environment
        run: docker build --tag tpmd-deb:latest --file packaging/deb/Dockerfile .

      - name: Build the source package
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            --env CARGO_HOME=/tmp/cargo-home \
            --env TPMD_DEB_VERSION='${{ needs.version.outputs.value }}' \
            --env TPMD_DEB_COMMIT='${{ github.sha }}' \
            tpmd-deb:latest \
            packaging/deb/build-source.sh dist

      - name: Lint the source package
        # newer-standards-version only: the pinned container is the oldest
        # supported release, and its lintian predates the policy version the
        # package declares. Everything else fails the build.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            tpmd-deb:latest \
            lintian --fail-on error,warning --suppress-tags newer-standards-version dist/*.dsc

      - uses: actions/upload-artifact@v4
        with:
          name: deb-source
          path: |
            dist/*.dsc
            dist/*.tar.xz
          if-no-files-found: error

  build:
    name: build (${{ matrix.arch }})
    needs: [version, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 builds natively rather than under emulation: GitHub's arm64
          # runners are free for public repositories, and this workspace under
          # QEMU is half an hour per nightly rather than a couple of minutes.
          # Building on the target architecture also means the container base
          # image, the toolchain and the glibc floor are all the real ones.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the build environment
        run: docker build --tag tpmd-deb:latest --file packaging/deb/Dockerfile .

      - uses: actions/download-artifact@v5
        with:
          name: deb-source
          path: source

      - name: Build the packages from the source package
        # --network none is the proof that the published source is complete: a
        # build that needed anything beyond the .dsc and its tarball fails here,
        # rather than working in CI and nowhere else.
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            --env CARGO_HOME=/tmp/cargo-home \
            --env TPMD_DEB_DSC="$(ls source/*.dsc)" \
            tpmd-deb:latest \
            packaging/deb/build-deb.sh dist

      - name: Lint the package
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            tpmd-deb:latest \
            lintian --fail-on error,warning dist/*.deb

      - name: Inspect what was built
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            tpmd-deb:latest \
            sh -c 'for deb in dist/*.deb; do dpkg-deb --info "$deb"; dpkg-deb --contents "$deb"; done'

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  publish:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Install the Cloudsmith CLI
        run: pipx install cloudsmith-cli

      - name: Push to the APT repository
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -eu
          # No --no-wait-for-sync: the verify job below installs from what this
          # pushed, so it has to be there before this step returns.
          # --republish because a nightly rebuilding the same version is a
          # replacement rather than a conflict.
          # The .dsc is pushed like a .deb: the CLI reads the files it lists
          # and uploads the tarball with it, and the repository then serves it
          # to `apt-get source`. The `deb-src` line the setup script writes
          # expects it to be there.
          for package in dist/*.deb dist/*.dsc; do
            echo "pushing $package"
            cloudsmith push deb \
              "${CLOUDSMITH_OWNER}/${CLOUDSMITH_REPO}/${CLOUDSMITH_DISTRO}/${CLOUDSMITH_VERSION}" \
              "$package" \
              --component '${{ needs.version.outputs.component }}' \
              --republish
          done

  verify:
    name: verify installs (${{ matrix.arch }})
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner installs the artefact built for its own architecture,
          # from the published repository, on every supported release. This is
          # the only place the arm64 build is ever installed and run, so a
          # broken arm64 package cannot hide behind a green amd64 job.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install from the published repository, release by release
        env:
          # The channel this run published to. The install check defaults to
          # `main`, which is the stable channel, so a nightly that did not say
          # so would verify the wrong one.
          TPMD_VERIFY_COMPONENT: ${{ needs.version.outputs.component }}
        run: packaging/deb/verify-install.sh

  # The nightly channel keeps its last seven versions; stable keeps everything.
  # After `verify`, never before: a nightly that did not install cleanly on every
  # release does not get to push a good one out, and the version just published
  # is always the newest, so it is always kept. See the script for why this is
  # not Cloudsmith's own retention rule.
  prune:
    name: prune old nightlies
    if: needs.version.outputs.component == 'nightly'
    needs: [version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep the newest seven nightly versions
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: python3 packaging/deb/prune-nightlies.py --keep 7

  # A tag is a release, and a release carries artifacts. Deliberately inert for
  # now: `RELEASE_ARTIFACTS_COMPLETE` is unset, so a tag publishes to the `main`
  # component and stops there, because a release that carried only the Debian
  # packages would be a release that says "download me" about a machine it does
  # not yet serve.
  #
  # Set the repository variable to `true` once every platform is packaging. It is
  # a variable rather than a code change so the day the RPM, Arch, macOS and
  # Windows packages exist, turning releases on is a settings edit and not a
  # commit that races the others. Each of those workflows appends its own assets
  # to the same release, so nothing here has to know about them — and `needs:
  # verify` means a release only ever follows a package set that installed
  # cleanly on every supported release.
  release:
    name: git release
    if: github.ref_type == 'tag' && vars.RELEASE_ARTIFACTS_COMPLETE == 'true'
    needs: [version, source, build, publish, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release and attach what was built
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
