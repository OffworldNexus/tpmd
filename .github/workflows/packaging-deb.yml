name: deb packages

# Nightly .deb builds for every currently supported Debian-like release, and
# tagged stable releases, staged for the signed Offworld Nexus APT repository at
# https://apt.offworld-nexus.app (see docs/install.md). Nothing here runs on the
# push or pull-request path: the test suite and static analysis live in ci.yml,
# and this workflow exists to build, verify and stage release artifacts.
#
# Zero publishing credentials live in GitHub secrets: once this workflow
# completes with `success` and uploads `offworld-dist`, the organization's
# `offworld-nexus-packages` GitHub App on Chulak receives the `workflow_run`
# webhook, verifies ref/tag policy against the GitHub API, GPG-signs and indexes
# the repository (`main` or `nightly`), prunes nightlies to the newest seven
# release sets, syncs atomically to Incus S3 + Cloudflare R2, and posts the
# `offworld-pkg / publish` Check Run on the commit.
#
# A `v*` tag is the release trigger. The tag's commit must carry the same
# workspace version as the tag (the `version` job refuses otherwise), and the
# tag must be annotated: its first line becomes the release title and the rest
# becomes the hand-written part of the release notes (docs/releasing.md).
on:
  schedule:
    # Nightly, off the hour so it does not collide with everyone else's builds.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to stamp, if the default is not wanted. A tagged release
          reuses this workflow unchanged with the tag's version.
        required: false
        type: string
      rehearsal:
        description: >-
          Build and install-verify every package without uploading offworld-dist.
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: decide the version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.pick.outputs.version }}
      channel: ${{ steps.pick.outputs.channel }}
      should_publish: ${{ steps.pick.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        name: Pick a version and a channel
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            version="${GITHUB_REF_NAME#v}"
            channel=stable
            cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            if [ "$cargo_version" != "$version" ]; then
              echo "tag ${GITHUB_REF_NAME} is ${version}, but Cargo.toml says ${cargo_version}" >&2
              echo "bump the workspace version before tagging (docs/releasing.md)" >&2
              exit 1
            fi
          elif [ -n "${{ inputs.version }}" ]; then
            version='${{ inputs.version }}'
            channel=nightly
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            version="${base}~nightly$(date -u +%Y%m%d).r${GITHUB_RUN_NUMBER}+g$(git rev-parse --short HEAD)"
            channel=nightly
          fi
          should_publish=true
          if [ "${{ inputs.rehearsal }}" = "true" ]; then
            should_publish=false
          fi
          echo "packaging $version for channel=$channel (should_publish=$should_publish)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

  # One source package per run, built once and shared: it is published beside the
  # binaries, and every architecture builds its binaries *from* it, so what
  # `apt-get source tpmd` hands a user is what the published binaries came from.
  source:
    name: source package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the build environment
        run: docker build --tag tpmd-deb:latest --file packaging/deb/Dockerfile .

      - name: Build the source package
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            --env CARGO_HOME=/tmp/cargo-home \
            --env TPMD_DEB_VERSION='${{ needs.version.outputs.value }}' \
            --env TPMD_DEB_COMMIT='${{ github.sha }}' \
            tpmd-deb:latest \
            packaging/deb/build-source.sh dist

      - name: Lint the source package
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            tpmd-deb:latest \
            lintian --fail-on error,warning --suppress-tags newer-standards-version dist/*.dsc

      - uses: actions/upload-artifact@v4
        with:
          name: deb-source
          path: |
            dist/*.dsc
            dist/*.tar.xz
          if-no-files-found: error

  build:
    name: build (${{ matrix.arch }})
    needs: [version, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the build environment
        run: docker build --tag tpmd-deb:latest --file packaging/deb/Dockerfile .

      - uses: actions/download-artifact@v5
        with:
          name: deb-source
          path: source

      - name: Build the packages from the source package
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            --env CARGO_HOME=/tmp/cargo-home \
            --env TPMD_DEB_DSC="$(ls source/*.dsc)" \
            tpmd-deb:latest \
            packaging/deb/build-deb.sh dist

      - name: Lint the package
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            tpmd-deb:latest \
            lintian --fail-on error,warning dist/*.deb

      - name: Inspect what was built
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/tmp/src" \
            --workdir /tmp/src \
            tpmd-deb:latest \
            sh -c 'for deb in dist/*.deb; do dpkg-deb --info "$deb"; dpkg-deb --contents "$deb"; done'

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # Pre-publish verification: every supported Debian/Ubuntu release installs the
  # built package set natively on both amd64 and arm64 and unpacks the .dsc
  # source *before* anything is staged into offworld-dist. A broken build never
  # reaches the signed repository.
  verify:
    name: verify installs (${{ matrix.arch }})
    needs: [version, source, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: deb-${{ matrix.arch }}
          path: dist

      - uses: actions/download-artifact@v5
        with:
          name: deb-source
          path: source

      - name: Install and exercise the built packages across every supported release
        run: |
          TPMD_DEB="$(ls dist/tpmd_*_${{ matrix.arch }}.deb)" \
          TPMD_DSC="$(ls source/*.dsc)" \
          packaging/deb/verify-install.sh

  stage:
    name: stage for Offworld Nexus APT repository
    if: needs.version.outputs.should_publish == 'true'
    needs: [version, source, build, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Validate and build offworld-dist bundle
        run: |
          python3 packaging/stage-dist.py \
            --source tpmd \
            --channel '${{ needs.version.outputs.channel }}' \
            --version '${{ needs.version.outputs.value }}' \
            --out "$RUNNER_TEMP/offworld-dist" \
            --file 'deb:amd64:dist/*_amd64.deb' \
            --file 'deb:arm64:dist/*_arm64.deb' \
            --file 'deb-src:source:dist/*.dsc'

      - uses: actions/upload-artifact@v4
        with:
          name: offworld-dist
          path: ${{ runner.temp }}/offworld-dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: git release
    if: github.ref_type == 'tag' && needs.version.outputs.should_publish == 'true'
    needs: [version, source, build, verify, stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Checksums for every artifact
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Read the annotated tag
        id: tag
        run: |
          set -eu
          git fetch --force --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != tag ]; then
            echo "release tags must be annotated: see docs/releasing.md" >&2
            exit 1
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" \
            --format='%(contents)' > /tmp/tag-message.md
          title=$(head -n 1 /tmp/tag-message.md | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          [ -n "$title" ] || title="tpmd ${GITHUB_REF_NAME#v}"
          {
            echo "title<<__TAG_TITLE__"
            echo "$title"
            echo "__TAG_TITLE__"
          } >> "$GITHUB_OUTPUT"
          tail -n +2 /tmp/tag-message.md > /tmp/tag-body.md

      - name: Publish the release and attach what was built
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag.outputs.title }}
          body_path: /tmp/tag-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
