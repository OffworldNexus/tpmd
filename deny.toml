[advisories]
# RUSTSEC-2026-0459 (CVE-2026-119375, GHSA-72w2-rjgg-q729): `libsqlite3-sys`
# releases 0.6.0..=0.38.2 bundle SQLite before 3.54.0, whose page cache can
# return uninitialized memory when a process opens a database next to a `-wal`
# file whose page size differs from the database's. The store reaches the
# vulnerable copy through `libsqlite3-sys` 0.37.0's `bundled` build, enabled by
# sea-orm's `sqlx-sqlite` feature chain: `sea-query-sqlx/sqlx-sqlite` ->
# `sqlx/sqlite` -> `sqlite-bundled` -> `sqlx-sqlite/bundled` ->
# `libsqlite3-sys/bundled`. `tpmd` never links `rusqlite`; this is the only path
# to the crate, and sea-orm exposes no feature that would make it build against
# the system SQLite instead (`sqlx/sqlite` always pulls in `sqlite-bundled`).
#
# There is no upgrade to take yet. `libsqlite3-sys` 0.39.0 is the first patched
# release, but `sqlx-sqlite` 0.9.0 — the newest published, and what `sqlx`
# 0.9.0 and `sea-orm` 2.0.4 (also the newest) require — constrains it to
# `>=0.30.1, <0.38.0`, so `cargo update -p libsqlite3-sys --precise 0.39.0`
# refuses to select it. No published `crates.io` release in the chain admits a
# patched version.
#
# `tpmd` is not exposed: the vulnerable tree needs a local attacker to write the
# database's sibling `-wal` file, and every `-wal` `tpmd` opens lives in its own
# state directory, which no less trusted party can write.
#   * The path is fixed, never client-supplied: `tpmd_store::open` opens
#     `state_dir/keys.sqlite` (`database_path` in `crates/tpmd-store/src/lib.rs`)
#     and no IPC operation accepts a database path. Keys are addressed by
#     fingerprint; there is no import, export or enumeration.
#   * The directory and file are owner-only before the first query:
#     `tpmd_store::open` calls `secure_fs::ensure_dir` (mode `0700`; a protected
#     owner-only DACL on Windows) and `secure_fs::restrict_file` (mode `0600`)
#     before any key is written, and the WAL/SHM sidecars are created inside
#     that same `0700` directory.
#   * In the packaged system service (`debian/tpmd.service`) the database is
#     `/var/lib/tpmd`, created by `StateDirectory=tpmd` with
#     `StateDirectoryMode=0700` and owned by `tss`; per-user agents use
#     `$XDG_DATA_HOME/tpmd`, `~/Library/Application Support/tpmd` or
#     `%LOCALAPPDATA%\tpmd`. An unprivileged local user cannot create or modify
#     the `-wal` file in any of them, and can only be told `unknown_key` over
#     the socket.
#
# Remove this ignore and upgrade as soon as `sqlx-sqlite` (or `sea-orm`, or a
# replacement SQLite layer) publishes a release whose `libsqlite3-sys`
# requirement admits 0.39.0 or newer and still builds on Rust 1.94 — then drop
# the entry, let `cargo update` take the patched version, and re-run the store
# tests.
#
# `zvariant`, `zvariant_derive` and `zbus_names` were folded into `zbus` at 6.0
# and are marked unmaintained as of 2026-10-16 (RUSTSEC-2026-0370 through
# -0372). The Secret Service credential store reaches them through `zbus` 5,
# which is what `secret-service` still builds on, so there is no upgrade to take
# — the advisories say as much themselves ("No safe upgrade is available").
# None of them is a vulnerability: they are unmaintained notices about crates
# that were merged into their parent. Remove these ignores as soon as
# `secret-service` moves to zbus 6, or if that backend is dropped.
ignore = [
    "RUSTSEC-2026-0459", # libsqlite3-sys: bundled SQLite < 3.54.0, not exposed
    "RUSTSEC-2026-0370", # zvariant, unmaintained
    "RUSTSEC-2026-0371", # zbus_names, unmaintained
    "RUSTSEC-2026-0372", # zvariant_derive, unmaintained
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    # `libloading`, the `dlopen` the packaging split's plugin loader uses. ISC
    # is the same permissive, OSI-approved family as the rest of this list; it is
    # named separately only because nothing else in the tree is licensed that
    # way.
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# `warn`, not `deny`, on purpose: the graph legitimately carries more than one
# semver line of a few crates — `sha2` 0.10 (SeaORM/sqlx) beside 0.11
# (`p256`/`secret-service`), `hashbrown` 0.16 beside 0.17, and the `zbus` 5
# tree — because the consumers are on incompatible majors. Unifying them is an
# upstream change, not a tpmd defect, so these are reported as information.
[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
